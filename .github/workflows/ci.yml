name: Fresh MCPE checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m compileall -q fresh_mcpe.py fresh_mcpe_core.py tests
      - name: Check shell scripts
        run: bash -n install.sh run.sh runtime/build.sh
      - name: Build UI offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c 'from PySide6.QtWidgets import QApplication; from fresh_mcpe import FreshMCPE; app = QApplication([]); window = FreshMCPE(); window.refresh_all(); window.close()'
